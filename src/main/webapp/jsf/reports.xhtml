<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"><h:head><title>JSF Reports</title><h:outputStylesheet library="assets" name="dashboard.css" /></h:head><h:body><main><h:link value="Dashboard" outcome="/jsf/dashboard" /> | <h:link value="Reports" outcome="/jsf/reports" /> | <h:link value="Tickets" outcome="/jsf/tickets" /><header><h1>Reports</h1><p>Component-based JSF report rendering</p></header><section class="panel"><h2>Request metrics</h2><h:dataTable value="#{dashboard.data.reports}" var="row"><h:column><h:outputText value="#{row.name}" /></h:column><h:column><h:outputText value="#{row.requests}" /></h:column><h:column><h:outputText value="#{row.trend}" /></h:column></h:dataTable></section><section class="panel"><h2>Activity status</h2><h:dataTable value="#{dashboard.data.activities}" var="item"><h:column><h:outputText value="#{item.time}" /></h:column><h:column><h:outputText value="#{item.message}" /></h:column><h:column><h:outputText value="#{item.status}" /></h:column></h:dataTable></section></main></h:body></html>
