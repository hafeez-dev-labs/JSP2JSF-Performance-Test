<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"><h:head><title>JSF Tickets</title><h:outputStylesheet library="assets" name="dashboard.css" /></h:head><h:body><main><h:link value="Dashboard" outcome="/jsf/dashboard" /> | <h:link value="Reports" outcome="/jsf/reports" /> | <h:link value="Tickets" outcome="/jsf/tickets" /><header><h1>Tickets</h1><p>JSF forms, validation, filtering, and component-based table rendering</p></header><h:form><section class="panel"><h2>Create ticket request</h2><h:messages/><div class="form-grid"><h:outputLabel for="title" value="Title"/><h:inputText id="title" value="#{jsfApp.title}" required="true" requiredMessage="Title is required."/><h:outputLabel for="owner" value="Owner"/><h:inputText id="owner" value="#{jsfApp.owner}" required="true" requiredMessage="Owner is required."/><h:commandButton value="Submit request" action="#{jsfApp.submitTicket}"/></div></section><section class="panel"><h2>Filter tickets</h2><h:selectOneMenu value="#{jsfApp.selectedStatus}"><f:selectItem itemValue="All" itemLabel="All"/><f:selectItem itemValue="Open" itemLabel="Open"/><f:selectItem itemValue="In Progress" itemLabel="In Progress"/><f:selectItem itemValue="Resolved" itemLabel="Resolved"/></h:selectOneMenu><h:commandButton value="Apply filter" action="#{jsfApp.filter}"/></section><section class="panel"><h2>Ticket queue</h2><h:dataTable value="#{jsfApp.tickets}" var="ticket"><h:column><h:outputText value="#{ticket.id}"/></h:column><h:column><h:outputText value="#{ticket.title}"/></h:column><h:column><h:outputText value="#{ticket.owner}"/></h:column><h:column><h:outputText value="#{ticket.status}"/></h:column><h:column><h:outputText value="#{ticket.priority}"/></h:column></h:dataTable></section></h:form></main></h:body></html>
